[project]
name = "msbit"
version = "0.1.0"
description = "Bitmap-based similarity search for peptide mass spectrometry."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.64.0",
    "numpy>=2.4.2",
]
authors = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
maintainers = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
license = "MIT"
keywords = ["mass spectrometry", "proteomics", "bitmap", "similarity search", "peptide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
# Used only by paper/ — sagepy comparison + mzML reading. Not needed by msbit itself.
# Install with: uv sync --extra paper
# sagepy 0.4.5 + spxtacular 0.3.0 are the versions that produced the numbers
# recorded in paper/data/compare_cpu.json. sagepy is pre-1.0 and its digest and
# hyperscore are both sides of the comparison, so an open floor here would let
# two different results both call themselves this experiment.
# mzmlpy 0.4.0 is the version that produced those numbers too, and the bound is
# not optional: spxtacular 0.3.0 declares `mzmlpy>=0.4.0` with no upper bound,
# and mzmlpy renamed `Spectrum.charge` to `charge_array` after 0.4.0, so
# spxtacular 0.3.0's MzmlReader raises AttributeError on the first spectrum of
# any file against a current mzmlpy. Without this line the extra installs but
# paper/run_comparison.py cannot read an mzML at all.
paper = [
    "sagepy>=0.4.5,<0.5",
    "spxtacular>=0.3.0,<0.4",
    "mzmlpy>=0.4,<0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msbit"]

[tool.uv]
package = true
dev-dependencies = [
    "matplotlib>=3.10.8",
    "polars>=1.38.1",
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    "ruff>=0.14.11",
    "ty>=0.0.11",
]

[tool.pytest.ini_options]
# paper/ is not part of the installed package; expose it on sys.path so tests can import it.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

